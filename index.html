<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launchpad — 곧 출시됩니다</title>
  <meta name="description" content="새로운 서비스가 곧 출시됩니다. 대기자 명단에 등록하세요." />
  <style>
    :root {
      --bg: #0b0d12; --card: #141821; --text: #eef1f6; --muted: #9aa3b2;
      --accent: #6c8cff; --accent-2: #9d6cff; --ok: #3ecf8e; --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1d2442 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 110%, #2a1d42 0%, transparent 60%), var(--bg);
      color: var(--text); padding: 24px 16px;
    }
    main { width: 100%; max-width: 640px; text-align: center; }
    .badge {
      display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px;
      background: rgba(108,140,255,.12); color: var(--accent); border: 1px solid rgba(108,140,255,.3);
    }
    h1 { font-size: clamp(32px, 7vw, 56px); line-height: 1.1; margin: 20px 0 16px; letter-spacing: -0.02em; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.lead { color: var(--muted); font-size: 18px; line-height: 1.6; margin: 0 auto 32px; max-width: 520px; }
    form { display: flex; gap: 8px; max-width: 460px; margin: 0 auto; flex-wrap: wrap; }
    input {
      flex: 1 1 220px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a3142;
      background: var(--card); color: var(--text); font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      flex: 0 0 auto; padding: 14px 20px; border-radius: 12px; border: 0; cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: white; font-weight: 600; font-size: 16px;
    }
    button:disabled { opacity: .6; cursor: default; }
    #msg { min-height: 24px; margin-top: 14px; font-size: 15px; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 48px; text-align: left; }
    .feature { background: var(--card); border: 1px solid #222838; border-radius: 14px; padding: 16px; }
    .feature b { display: block; margin-bottom: 6px; }
    .feature small { color: var(--muted); line-height: 1.5; }
    footer { margin-top: 40px; color: #5d6575; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">🚀 Coming soon</span>
    <h1>아이디어를 <span>더 빠르게</span> 출시하세요</h1>
    <p class="lead">Launchpad가 곧 출시됩니다. 이메일을 남겨주시면 가장 먼저 소식을 알려드릴게요.</p>

    <form id="waitlist">
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
      <button id="submit" type="submit">대기자 등록</button>
    </form>
    <div id="msg" role="status"></div>

    <section class="features">
      <div class="feature"><b>⚡ 빠른 시작</b><small>몇 분 만에 프로젝트를 띄우세요.</small></div>
      <div class="feature"><b>🔒 안전한 데이터</b><small>Supabase 기반의 안정적인 저장소.</small></div>
      <div class="feature"><b>🌍 글로벌 배포</b><small>Vercel 엣지 네트워크로 어디서나 빠르게.</small></div>
    </section>

    <footer>© 2026 Launchpad</footer>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

    // Publishable key: safe in the browser; RLS only allows inserts into waitlist.
    const supabase = createClient(
      "https://nrlrpanqzbdcbgjyqjua.supabase.co",
      "sb_publishable_A7D7rGPcA6UzUEhCgaXaQA_jQ_BneG_"
    );

    const form = document.getElementById("waitlist");
    const email = document.getElementById("email");
    const btn = document.getElementById("submit");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = ""; msg.textContent = "등록 중…";
      const { error } = await supabase.from("waitlist").insert({ email: email.value.trim().toLowerCase() });
      btn.disabled = false;
      if (!error) {
        msg.className = "ok"; msg.textContent = "등록 완료! 출시 소식을 가장 먼저 알려드릴게요 🎉";
        form.reset();
      } else if (error.code === "23505") {
        msg.className = "ok"; msg.textContent = "이미 등록된 이메일이에요. 감사합니다!";
      } else {
        msg.className = "err"; msg.textContent = "오류가 발생했어요. 잠시 후 다시 시도해주세요.";
      }
    });
  </script>
</body>
</html>
